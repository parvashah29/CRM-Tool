<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .draggable-source {
            opacity: 0.4;
        }

        /* Custom scrollbar for horizontal scrolling */
        ::-webkit-scrollbar {
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm z-10">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">Deals Pipeline</h1>
            <p class="text-sm text-slate-500">Track and manage your opportunities</p>
        </div>
        <button onclick="openModal()"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                    clip-rule="evenodd" />
            </svg>
            Add New Deal
        </button>
    </header>

    <!-- Kanban Board -->
    <main class="flex-1 overflow-x-auto overflow-y-hidden bg-slate-50 p-6">
        <div class="flex h-full gap-6 min-w-max" id="board">
            <!-- Columns will be injected by JavaScript -->
        </div>
    </main>

    <!-- Add Deal Modal -->
    <div id="addDealModal"
        class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center z-50 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md transform scale-95 transition-transform duration-300"
            id="modalContent">
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h3 class="text-lg font-semibold text-slate-800">Add New Deal</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="addDealForm" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Deal Name</label>
                    <input type="text" name="name" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                        placeholder="e.g. Acme Corp License">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Value ($)</label>
                    <input type="number" name="amount" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                        placeholder="5000">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Company</label>
                    <input type="text" name="company" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                        placeholder="Acme Inc">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Stage</label>
                    <select name="stage"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition bg-white">
                        <option value="Lead">Lead</option>
                        <option value="Qualified">Qualified</option>
                        <option value="Proposal">Proposal</option>
                        <option value="Negotiation">Negotiation</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Expected Close Date</label>
                    <input type="date" name="date" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()"
                        class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition">Cancel</button>
                    <button type="submit"
                        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition shadow-sm">Create
                        Deal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- State ---
        const stages = ['Lead', 'Qualified', 'Proposal', 'Negotiation', 'Closed'];
        const stageColors = {
            'Lead': 'border-blue-500',
            'Qualified': 'border-yellow-500',
            'Proposal': 'border-purple-500',
            'Negotiation': 'border-orange-500',
            'Closed': 'border-green-500'
        };

        // Dummy Initial Data
        let deals = [
            { id: '1', name: 'Enterprise License', amount: 12000, company: 'TechGlobal', stage: 'Proposal', date: '2023-11-15' },
            { id: '2', name: 'Consulting Project', amount: 5500, company: 'StartUp Inc', stage: 'Lead', date: '2023-12-01' },
            { id: '3', name: 'Q4 Renewal', amount: 8000, company: 'LogiCorp', stage: 'Negotiation', date: '2023-11-20' },
            { id: '4', name: 'New Seat Add-ons', amount: 2400, company: 'DesignCo', stage: 'Qualified', date: '2023-12-10' },
            { id: '5', name: 'Annual Contract', amount: 25000, company: 'BigBank', stage: 'Closed', date: '2023-10-30' }
        ];

        // --- DOM Elements ---
        const board = document.getElementById('board');
        const modal = document.getElementById('addDealModal');
        const modalContent = document.getElementById('modalContent');
        const addDealForm = document.getElementById('addDealForm');

        // --- Render Functions ---
        function renderBoard() {
            board.innerHTML = '';
            stages.forEach(stage => {
                const column = document.createElement('div');
                column.className = 'flex flex-col w-80 min-w-[20rem] bg-slate-100 rounded-xl h-full shadow-inner border border-slate-200';
                column.innerHTML = `
                    <div class="p-4 border-b border-slate-200/50 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <h2 class="font-semibold text-slate-700">${stage}</h2>
                            <span class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-0.5 rounded-full">${deals.filter(d => d.stage === stage).length}</span>
                        </div>
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3 custom-scrollbar drag-column" 
                         dropzone="true"
                         data-stage="${stage}">
                        <!-- Cards go here -->
                        ${renderCards(stage)}
                    </div>
                `;
                board.appendChild(column);
            });
            attachDragEvents();
        }

        function renderCards(stage) {
            const stageDeals = deals.filter(d => d.stage === stage);
            if (stageDeals.length === 0) {
                return `<div class="p-4 text-center border-2 border-dashed border-slate-200 rounded-lg text-slate-400 text-sm">No deals</div>`;
            }
            return stageDeals.map(deal => `
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 ${stageColors[stage] || 'border-gray-500'} cursor-grab hover:shadow-md transition group relative active:cursor-grabbing"
                     draggable="true" 
                     data-id="${deal.id}">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-semibold text-slate-800 leading-tight">${deal.name}</h4>
                        <button onclick="deleteDeal('${deal.id}')" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition p-1 -mr-2 -mt-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <div class="text-sm text-slate-500 font-medium mb-3 flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                        ${deal.company}
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-50">
                        <span class="text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded text-sm">$${deal.amount.toLocaleString()}</span>
                        <span class="text-xs text-slate-400 font-medium flex items-center gap-1">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            ${new Date(deal.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // --- Interaction Functions ---
        function openModal() {
            modal.classList.remove('hidden');
            // Little timeout to allow display:block to apply before opacity transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);

            // Set default date to today
            document.querySelector('input[name="date"]').valueAsDate = new Date();
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                addDealForm.reset();
            }, 300);
        }

        function deleteDeal(id) {
            deals = deals.filter(d => d.id !== id);
            renderBoard();
        }

        addDealForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(addDealForm);
            const newDeal = {
                id: Date.now().toString(),
                name: formData.get('name'),
                amount: parseFloat(formData.get('amount')),
                company: formData.get('company'),
                stage: formData.get('stage'),
                date: formData.get('date')
            };
            deals.push(newDeal);
            renderBoard();
            closeModal();
        });

        // Close modal on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });


        // --- Drag and Drop Logic ---
        function attachDragEvents() {
            const cards = document.querySelectorAll('[draggable="true"]');
            const columns = document.querySelectorAll('.drag-column');

            cards.forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    e.target.classList.add('draggable-source');
                    e.dataTransfer.setData('text/plain', e.target.dataset.id);
                    e.dataTransfer.effectAllowed = 'move';
                });

                card.addEventListener('dragend', (e) => {
                    e.target.classList.remove('draggable-source');
                });
            });

            columns.forEach(col => {
                col.addEventListener('dragover', (e) => {
                    e.preventDefault(); // Necessary to allow dropping
                    e.dataTransfer.dropEffect = 'move';
                    col.classList.add('bg-slate-200/50'); // Highlight effect
                });

                col.addEventListener('dragleave', (e) => {
                    col.classList.remove('bg-slate-200/50');
                });

                col.addEventListener('drop', (e) => {
                    e.preventDefault();
                    col.classList.remove('bg-slate-200/50');
                    const dealId = e.dataTransfer.getData('text/plain');
                    const targetStage = col.dataset.stage;

                    const dealIndex = deals.findIndex(d => d.id === dealId);
                    if (dealIndex > -1 && deals[dealIndex].stage !== targetStage) {
                        deals[dealIndex].stage = targetStage;
                        renderBoard();
                    }
                });
            });
        }

        // Initialize
        renderBoard();

    </script>
</body>

</html>
