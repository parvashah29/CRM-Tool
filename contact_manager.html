<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        dark: '#111827',
                        light: '#F3F4F6'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .contact-card {
            transition: all 0.3s ease;
        }
        .contact-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center text-primary">
                <i class="fa-solid fa-address-book text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-900 tracking-tight">Contacts<span class="text-primary">Pro</span></h1>
        </div>
        <button onclick="openModal()" class="bg-primary hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Add Contact
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-7xl mx-auto">
            
            <!-- Search & Filter -->
            <div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center">
                <div class="relative w-full sm:w-96">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search contacts..." 
                        class="pl-10 pr-4 py-3 w-full border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all bg-white shadow-sm text-sm"
                        oninput="filterContacts()">
                </div>
                <div class="text-sm text-gray-500 font-medium">
                    Showing <span id="contactCount" class="text-gray-900">0</span> contacts
                </div>
            </div>

            <!-- Contacts Grid -->
            <div id="contactsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Contacts will be injected here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 mb-4">
                    <i class="fa-solid fa-user-slash text-3xl"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-900">No contacts found</h3>
                <p class="text-gray-500 mt-1 max-w-sm">We couldn't find any contacts matching your search. Try adjusting your filters or add a new contact.</p>
                <button onclick="openModal()" class="mt-6 text-primary font-medium hover:text-indigo-700 transition-colors">
                    Add new contact
                </button>
            </div>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="contactModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity opacity-0" id="modalOverlay"></div>
        
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg transform scale-95 opacity-0 transition-all duration-300" id="modalContent">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-900" id="modalTitle">Add New Contact</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
                
                <form id="contactForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                    <input type="hidden" id="contactId">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">First Name</label>
                            <input type="text" id="firstName" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Last Name</label>
                            <input type="text" id="lastName" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Email Address</label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-4 top-3 text-gray-400 text-sm"></i>
                            <input type="email" id="email" required class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Phone Number</label>
                        <div class="relative">
                            <i class="fa-solid fa-phone absolute left-4 top-3 text-gray-400 text-sm"></i>
                            <input type="tel" id="phone" required class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Company</label>
                        <div class="relative">
                            <i class="fa-solid fa-building absolute left-4 top-3 text-gray-400 text-sm"></i>
                            <input type="text" id="company" class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                        </div>
                    </div>

                    <div class="pt-4 flex gap-3">
                        <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 border border-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition-colors text-sm">Cancel</button>
                        <button type="submit" class="flex-1 px-4 py-2.5 bg-primary text-white rounded-lg font-medium hover:bg-indigo-700 shadow-lg shadow-indigo-500/30 transition-all transform active:scale-95 text-sm">Save Contact</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-dark text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
            <i class="fa-solid fa-check-circle text-green-400"></i>
            <span id="toastMessage" class="font-medium text-sm">Operation successful</span>
        </div>
    </div>

    <script>
        // State
        let contacts = [
            {
                id: '1',
                firstName: 'Sarah',
                lastName: 'Wilson',
                email: 'sarah.wilson@techcorp.com',
                phone: '+1 (555) 123-4567',
                company: 'TechCorp Inc.',
                avatarColor: 'bg-blue-100 text-blue-600'
            },
            {
                id: '2',
                firstName: 'Michael',
                lastName: 'Chen',
                email: 'm.chen@innovate.io',
                phone: '+1 (555) 987-6543',
                company: 'Innovate Labs',
                avatarColor: 'bg-emerald-100 text-emerald-600'
            },
            {
                id: '3',
                firstName: 'Emma',
                lastName: 'Rodriguez',
                email: 'emma.r@designstudio.co',
                phone: '+1 (555) 456-7890',
                company: 'Creative Design Flow',
                avatarColor: 'bg-purple-100 text-purple-600'
            }
        ];

        const colors = [
            'bg-red-100 text-red-600',
            'bg-orange-100 text-orange-600',
            'bg-amber-100 text-amber-600',
            'bg-green-100 text-green-600',
            'bg-emerald-100 text-emerald-600',
            'bg-teal-100 text-teal-600',
            'bg-cyan-100 text-cyan-600',
            'bg-blue-100 text-blue-600',
            'bg-indigo-100 text-indigo-600',
            'bg-violet-100 text-violet-600',
            'bg-purple-100 text-purple-600',
            'bg-fuchsia-100 text-fuchsia-600',
            'bg-pink-100 text-pink-600',
            'bg-rose-100 text-rose-600'
        ];

        // Random Color Generator
        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // DOM Elements
        const contactsGrid = document.getElementById('contactsGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const contactCount = document.getElementById('contactCount');
        const modal = document.getElementById('contactModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        const contactForm = document.getElementById('contactForm');
        const modalTitle = document.getElementById('modalTitle');

        // Initial Render
        renderContacts(contacts);

        function renderContacts(contactsToRender) {
            contactsGrid.innerHTML = '';
            contactCount.textContent = contactsToRender.length;

            if (contactsToRender.length === 0) {
                contactsGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            contactsGrid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            contactsToRender.forEach(contact => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-6 border border-gray-100 shadow-sm contact-card flex flex-col justify-between h-full';
                const initials = (contact.firstName[0] + contact.lastName[0]).toUpperCase();
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-14 h-14 rounded-full ${contact.avatarColor} flex items-center justify-center text-lg font-bold shadow-inner">
                            ${initials}
                        </div>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editContact('${contact.id}')" class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white transition-colors">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteContact('${contact.id}')" class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-red-500 hover:text-white transition-colors">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <h3 class="font-bold text-lg text-gray-900 leading-tight mb-1">${contact.firstName} ${contact.lastName}</h3>
                        <p class="text-sm font-medium text-primary">${contact.company || 'No Company'}</p>
                    </div>

                    <div class="space-y-3 mt-auto pt-4 border-t border-gray-50">
                        <div class="flex items-center gap-3 text-sm text-gray-600 hover:text-primary transition-colors cursor-pointer group">
                            <div class="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center group-hover:bg-primary/10 transition-colors">
                                <i class="fa-solid fa-envelope text-gray-400 group-hover:text-primary transition-colors"></i>
                            </div>
                            <span class="truncate">${contact.email}</span>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-600 hover:text-primary transition-colors cursor-pointer group">
                            <div class="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center group-hover:bg-primary/10 transition-colors">
                                <i class="fa-solid fa-phone text-gray-400 group-hover:text-primary transition-colors"></i>
                            </div>
                            <span>${contact.phone}</span>
                        </div>
                    </div>
                `;
                
                // Add hover effect for the action buttons (using JS to handle the parent hover state for the buttons visibility if CSS group-hover isn't enough on the card itself)
                card.addEventListener('mouseenter', () => {
                    const buttons = card.querySelector('.flex.gap-2');
                    buttons.classList.remove('opacity-0');
                    buttons.classList.add('opacity-100');
                });
                card.addEventListener('mouseleave', () => {
                    const buttons = card.querySelector('.flex.gap-2');
                    buttons.classList.remove('opacity-100');
                    buttons.classList.add('opacity-0');
                });

                contactsGrid.appendChild(card);
            });
        }

        // Modal Logic
        function openModal(contactId = null) {
            modal.classList.remove('hidden');
            // Trigger animation
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modalContent.classList.remove('opacity-0', 'scale-95');
                modalContent.classList.add('scale-100');
            }, 10);

            if (contactId) {
                const contact = contacts.find(c => c.id === contactId);
                modalTitle.textContent = 'Edit Contact';
                document.getElementById('contactId').value = contact.id;
                document.getElementById('firstName').value = contact.firstName;
                document.getElementById('lastName').value = contact.lastName;
                document.getElementById('email').value = contact.email;
                document.getElementById('phone').value = contact.phone;
                document.getElementById('company').value = contact.company;
            } else {
                modalTitle.textContent = 'Add New Contact';
                contactForm.reset();
                document.getElementById('contactId').value = '';
            }
        }

        function closeModal() {
            modalOverlay.classList.add('opacity-0');
            modalContent.classList.add('opacity-0', 'scale-95');
            modalContent.classList.remove('scale-100');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Close modal on click outside
        modalOverlay.addEventListener('click', closeModal);

        // Form Handling
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const formData = {
                id: document.getElementById('contactId').value,
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                company: document.getElementById('company').value.trim()
            };

            if (formData.id) {
                // Edit
                const index = contacts.findIndex(c => c.id === formData.id);
                if (index !== -1) {
                    contacts[index] = { ...contacts[index], ...formData };
                    showToast('Contact updated successfully');
                }
            } else {
                // Add
                const newContact = {
                    ...formData,
                    id: Date.now().toString(),
                    avatarColor: getRandomColor()
                };
                contacts.unshift(newContact); // Add to top
                showToast('Contact added successfully');
            }

            closeModal();
            filterContacts(); // Re-render with current filter
        }

        // Delete Logic
        function deleteContact(id) {
            if (confirm('Are you sure you want to delete this contact? This action cannot be undone.')) {
                contacts = contacts.filter(c => c.id !== id);
                filterContacts();
                showToast('Contact deleted successfully');
            }
        }

        function editContact(id) {
            openModal(id);
        }

        // Filter Logic
        function filterContacts() {
            const query = searchInput.value.toLowerCase();
            const filtered = contacts.filter(contact => 
                contact.firstName.toLowerCase().includes(query) ||
                contact.lastName.toLowerCase().includes(query) ||
                contact.email.toLowerCase().includes(query) ||
                contact.company.toLowerCase().includes(query)
            );
            renderContacts(filtered);
        }

        // Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
